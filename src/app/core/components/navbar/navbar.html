<nav class="sticky top-0 z-[1000] w-full px-6 py-4 font-sans">
  <div
    class="max-w-7xl mx-auto bg-white/70 backdrop-blur-md border border-white/40 rounded-[2rem] px-6 py-3 flex items-center justify-between shadow-xl shadow-slate-200/50">

    <div class="flex items-center gap-3 cursor-pointer group" routerLink="/dashboard">
      <div
        class="w-10 h-10 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg shadow-indigo-200 group-hover:scale-110 transition-transform">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
        </svg>
      </div>
      <div class="flex flex-col">
        <span class="text-lg font-black text-slate-900 leading-none tracking-tighter">Legajo360</span>
        <span class="text-[9px] font-black text-indigo-500 uppercase tracking-[0.2em]">Kernel Studio</span>
      </div>
    </div>

    @if (user$ | async; as user) {
    <div class="hidden md:flex items-center gap-1 bg-slate-100/50 p-1 rounded-2xl border border-slate-200/30">
      <button routerLink="/dashboard"
        class="px-5 py-2 text-xs font-black uppercase tracking-widest text-slate-700 hover:bg-white rounded-xl transition-all shadow-sm hover:shadow-indigo-100">Dashboard</button>
      <button
        class="px-5 py-2 text-xs font-black uppercase tracking-widest text-slate-400 hover:text-slate-700 hover:bg-white rounded-xl transition-all">Reportes</button>
    </div>
    }

    <div class="flex items-center gap-4 relative">

      @if (user$ | async; as user) {
      <div class="hidden sm:flex flex-col items-end">
        <span class="text-xs font-black text-slate-900 leading-none">{{ user.displayName }}</span>
        <span class="text-[9px] font-bold text-indigo-500 uppercase tracking-widest mt-1">{{ user.role || 'Empleado'
          }}</span>
      </div>

      <button (click)="toggleMenu()"
        class="relative w-11 h-11 rounded-2xl overflow-hidden border-2 border-white shadow-md hover:border-indigo-500 transition-all bg-indigo-50 flex items-center justify-center group focus:ring-4 focus:ring-indigo-50">
        @if (user.photoURL) {
        <img [src]="user.photoURL" class="w-full h-full object-cover">
        } @else {
        <span class="text-lg font-black text-indigo-600">{{ user.displayName.substring(0,1) }}</span>
        }
        <div class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-green-500 border-2 border-white rounded-full"></div>
      </button>

      @if (isMenuOpen) {
      <div class="fixed inset-0 z-[-1]" (click)="toggleMenu()"></div>

      <div
        class="absolute top-14 right-0 w-56 bg-white border border-slate-100 rounded-[2rem] shadow-2xl shadow-slate-200/60 p-3 animate-in fade-in slide-in-from-top-2 duration-200">
        <div class="px-4 py-3 mb-2 border-b border-slate-50">
          <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Mi Cuenta</p>
        </div>

        <button
          class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 rounded-2xl transition-all group">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400 group-hover:text-indigo-600" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          Perfil
        </button>

        <button (click)="logout()"
          class="w-full flex items-center gap-3 px-4 py-3 text-sm font-bold text-red-500 hover:bg-red-50 rounded-2xl transition-all group mt-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 group-hover:scale-110 transition-transform" fill="none"
            viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Cerrar Sesión
        </button>
      </div>
      }

      } @else {
      <button routerLink="/login"
        class="px-8 py-3 bg-slate-900 text-white text-[10px] font-black uppercase tracking-[0.2em] rounded-2xl hover:bg-indigo-600 transition-all shadow-xl shadow-slate-200 transform active:scale-95">
        Ingresar
      </button>
      }

    </div>
  </div>
</nav>
