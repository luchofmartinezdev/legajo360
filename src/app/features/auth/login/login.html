<div class="login-page">
  <div class="background-overlay"></div>

  <div class="login-card">
    
    <div class="brand-panel">
      <div class="brand-content">
        <div class="logo-box">
          <mat-icon>assignment_ind</mat-icon>
        </div>
        <h1>Legajo<span>360</span></h1>
        <p class="product-slogan">Tu legajo digital, simple y seguro</p>
        
        <div class="dev-signature">
          <span class="by">By</span>
          <span class="company">Kernel Studio</span>
          <p class="company-slogan">Software simple para negocios reales.</p>
        </div>
      </div>
    </div>

    <div class="auth-panel">
      <div class="auth-content">
        <h2>Bienvenido</h2>
        <p>Accedé a tus recibos de sueldo y datos personales.</p>
        
        <button mat-flat-button class="google-login-btn" (click)="login()">
          <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google">
          Ingresar con Google
        </button>

        <div class="security-info">
          <mat-icon>verified_user</mat-icon>
          <span>Conexión cifrada de punto a punto</span>
        </div>
      </div>
    </div>

  </div>
</div>
