<div class="min-h-screen w-full flex items-center justify-center bg-[#f8fafc] relative overflow-hidden font-sans">
  
  <div class="absolute inset-0 opacity-[0.03]" 
       style="background-image: radial-gradient(#4f46e5 1px, transparent 1px); background-size: 32px 32px;">
  </div>
  
  <div class="absolute top-[-10%] right-[-10%] w-[600px] h-[600px] bg-indigo-100/50 blur-[120px] rounded-full"></div>
  <div class="absolute bottom-[-10%] left-[-10%] w-[600px] h-[600px] bg-purple-100/40 blur-[120px] rounded-full"></div>

  <div class="relative z-10 w-full max-w-[420px] px-6 py-12">
    
    <div class="bg-white/60 backdrop-blur-3xl border border-white rounded-[3.5rem] px-10 py-16 shadow-[0_32px_64px_-16px_rgba(0,0,0,0.06)] flex flex-col items-center">
      
      <div class="flex flex-col items-center mb-12">
        <div class="w-20 h-20 bg-slate-900 rounded-[28px] flex items-center justify-center shadow-2xl shadow-slate-200 mb-8 transform hover:scale-110 transition-transform duration-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
        </div>
        <h1 class="text-4xl font-black text-slate-900 tracking-tighter italic">Legajo360</h1>
        <p class="text-[11px] font-black text-indigo-500 uppercase tracking-[0.3em] mt-2">Kernel Studio Solutions</p>
      </div>

      <button type="button" 
              (click)="loginWithGoogle()"
              class="group relative w-full flex items-center justify-center gap-4 bg-slate-900 text-white px-8 py-5 rounded-2xl font-black shadow-2xl shadow-slate-200 hover:bg-indigo-600 hover:shadow-indigo-100 transition-all duration-300 active:scale-95">
        <div class="bg-white p-1.5 rounded-lg">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google">
        </div>
        <span class="text-xs uppercase tracking-[0.2em]">Ingresar</span>
      </button>

      <div class="mt-16 pt-8 border-t border-slate-900/5 w-full text-center">
        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em] leading-relaxed italic">
          Acceso restringido para <br> miembros de la organización
        </p>
      </div>
    </div> 

  </div>
</div>
