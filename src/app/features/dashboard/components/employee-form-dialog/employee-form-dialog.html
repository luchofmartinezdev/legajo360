<div class="relative w-full max-w-2xl bg-white rounded-[2.5rem] shadow-2xl overflow-hidden animate-in zoom-in-95 duration-300">
  
  <div class="p-8 border-b border-slate-50 flex justify-between items-center bg-white/50 backdrop-blur-sm">
    <div>
      <h2 class="text-2xl font-black text-slate-900 tracking-tighter italic">Alta de Nuevo Ingreso</h2>
      <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Configuración de legajo digital</p>
    </div>
    
    <button (click)="autocompletarDatos()" 
            class="flex items-center gap-2 px-4 py-2 bg-indigo-50 text-indigo-600 rounded-xl font-bold text-xs hover:bg-indigo-600 hover:text-white transition-all group">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 group-hover:rotate-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
      </svg>
      Autocompletar
    </button>
  </div>

  <form [formGroup]="employeeForm" class="p-8 space-y-6">
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="space-y-1">
        <label class="text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">Número de Legajo</label>
        <div class="relative">
          <input formControlName="legajoNumber" type="text" placeholder="Ej: 1050"
                 class="w-full pl-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-600 focus:bg-white transition-all font-medium text-slate-700">
        </div>
      </div>

      <div class="space-y-1">
        <label class="text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">Nombre Completo</label>
        <input formControlName="displayName" type="text" placeholder="Ej: Juan Pérez"
               class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-600 focus:bg-white transition-all font-medium text-slate-700">
      </div>
    </div>

    <div class="space-y-1">
      <label class="text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">Correo Electrónico Corporativo</label>
      <input formControlName="email" type="email" placeholder="usuario@kernel.studio"
             class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-600 focus:bg-white transition-all font-medium text-slate-700">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="space-y-1">
        <label class="text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">DNI</label>
        <input formControlName="dni" type="text" placeholder="Sin puntos"
               class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-600 focus:bg-white transition-all font-medium text-slate-700">
      </div>

      <div class="space-y-1">
        <label class="text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">CUIL</label>
        <input formControlName="cuil" type="text" placeholder="20-XXXXXXXX-X"
               class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-600 focus:bg-white transition-all font-medium text-slate-700">
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="space-y-1">
        <label class="text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">Puesto / Cargo</label>
        <input formControlName="position" type="text" placeholder="Ej: Backend Developer"
               class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-600 focus:bg-white transition-all font-medium text-slate-700">
      </div>

      <div class="space-y-1">
        <label class="text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">Sector</label>
        <div class="relative">
          <select formControlName="sector" 
                  class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-600 focus:bg-white transition-all font-medium text-slate-700 appearance-none">
            <option value="Development">Development</option>
            <option value="Design">Design</option>
            <option value="QA">QA</option>
            <option value="RRHH">Recursos Humanos</option>
            <option value="Management">Management</option>
          </select>
          <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
          </div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="space-y-1">
        <label class="text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">Fecha de Ingreso</label>
        <input formControlName="joinDate" type="date"
               class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-600 focus:bg-white transition-all font-medium text-slate-700">
      </div>

      <div class="space-y-1">
        <label class="text-[10px] font-black text-slate-400 uppercase ml-1 tracking-widest">Rol en Sistema</label>
        <div class="relative">
          <select formControlName="role" 
                  class="w-full px-5 py-3.5 bg-slate-50 border border-slate-100 rounded-2xl outline-none focus:border-indigo-600 focus:bg-white transition-all font-medium text-slate-700 appearance-none">
            <option value="employee">Empleado (Solo lectura)</option>
            <option value="rrhh">RRHH (Gestiona nómina)</option>
            <option value="admin">Administrador Total</option>
          </select>
          <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-slate-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
          </div>
        </div>
      </div>
    </div>

    <div class="flex gap-4 pt-6">
      <button type="button" (click)="cerrarFormModal()"
              class="flex-1 px-6 py-4 rounded-2xl font-bold text-slate-400 hover:bg-slate-50 transition-all text-sm uppercase tracking-widest">
        Cancelar
      </button>
      <button type="button" [disabled]="employeeForm.invalid" (click)="guardar()"
              class="flex-[2] px-6 py-4 rounded-2xl font-bold bg-slate-900 text-white hover:bg-indigo-600 disabled:opacity-20 disabled:cursor-not-allowed transition-all text-sm shadow-xl shadow-slate-200 uppercase tracking-widest flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
        Crear Legajo
      </button>
    </div>

  </form>
</div>
